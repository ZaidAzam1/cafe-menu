<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swigy Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Swigy Cafe</h1>

        <!-- Cafe Image -->
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600" alt="Swigy Cafe Coffee" class="cafe-img">

        <!-- Menu Table -->
        <table>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Ingredients</th>
            </tr>
            <tr>
                <td>Cappuccino</td>
                <td>Rs. 450</td>
                <td>Espresso, Steamed Milk, Milk Foam</td>
            </tr>
            <tr>
                <td>Chocolate Brownie</td>
                <td>Rs. 350</td>
                <td>Dark Chocolate, Butter, Flour, Walnuts</td>
            </tr>
            <tr>
                <td>Club Sandwich</td>
                <td>Rs. 600</td>
                <td>Grilled Chicken, Bread, Cheese, Lettuce, Mayo</td>
            </tr>
        </table>

        <!-- Order Now Button -->
        <button onclick="confirmOrder()">Order Now</button>
    </div>

    <!-- JavaScript for Dialog Box -->
    <script>
        function confirmOrder() {
            alert("Your order is confirmed!");
        }
    </script>

</body>
</html>
